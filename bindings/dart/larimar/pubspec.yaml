name: larimar
description: Dart and Flutter FFI bindings for the Larimar game engine core.
version: 0.1.0-dev.2
publish_to: none

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  code_assets: ^1.1.0
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  hooks: ^2.0.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.0

dev_dependencies:
  ffigen: ^21.0.0
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  test: ^1.25.8

topics:
  - ffi
  - flutter
  - game-engine

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: LarimarPlugin
  assets:
    - assets/pong.gpu.cpp
